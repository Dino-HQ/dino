# Example: run Dino on every push to main and on PRs.
# Copy this into your repo's .github/workflows/ directory. Guide: https://usedino.dev/docs/ci
#
# Secrets:
#   API_URL    — your deployed API endpoint (run Dino after the API is deployed)
#   API_TOKEN  — bearer token for your API (optional)

name: API Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dino-scan:
    runs-on: ubuntu-latest
    steps:
      # Pin the action to a commit and the CLI to a version, so upgrades are deliberate.
      - uses: Dino-HQ/dino/.github/actions/scan@a0e02c88d30fd040d12cdc8f8221513e091756de
        with:
          api-url: ${{ secrets.API_URL }}
          api-token: ${{ secrets.API_TOKEN }}
          cli-version: 1.1.3
          fail-on-high: true   # exit 3 on any HIGH or CRITICAL finding
          # protocol: rest
          # spec-url: https://your-api.com/openapi.json
