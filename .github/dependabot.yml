version: 2
# npm dependencies are not updated here: packages/ is synced from the private source repo on every
# release (package.json included), so a bump made in this repo is overwritten at the next release.
# Dependency updates for the CLI happen upstream, where its tests run. Security alerts still apply.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      all-actions:
        patterns: ["*"]
