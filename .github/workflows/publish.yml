# Dino npm Publish — OIDC Trusted Publishing
# Triggered by project-dino after security gates + build pass.
# Receives tarball artifact, verifies checksum, publishes with provenance.
#
# IMPORTANT: This workflow contains NO security gate logic.
# All gates run in the private repo before dispatch.
#
# Copy into Dino-HQ/dino repository root (public). Requires:
# - npm Trusted Publishing: org Dino-HQ, repo dino, workflow publish.yml
# - Secret PROJECT_DINO_ACTIONS_TOKEN: fine-grained PAT, Actions: Read on Dino-HQ/project-dino

name: 'Publish to npm'

on:
  repository_dispatch:
    types: [publish-packages]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'project-dino workflow run ID containing tarballs'
        required: true
      version:
        description: 'Package version to publish'
        required: true
      checksums:
        description: 'Base64-encoded SHA256 checksums'
        required: true

permissions: {}

jobs:
  publish:
    name: 'Publish with provenance'
    runs-on: ubuntu-latest # MUST be GitHub-hosted for OIDC
    permissions:
      contents: write # create the signed GitHub Release (Scorecard Signed-Releases)
      id-token: write # OIDC: npm provenance + build attestation
      attestations: write # generate the Sigstore build-provenance attestation
    steps:
      # Node 24 LTS ships npm 11.11+ which supports OIDC trusted publishing.
      # Node 22 ships npm 10.9.7 which: (a) doesn't support OIDC, (b) the toolcache
      # build is broken — `npm install -g` crashes with MODULE_NOT_FOUND for promise-retry.
      # See: actions/runner-images#13883, nodejs/node#62425
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Print versions
        run: |
          echo "node: $(node --version)"
          echo "npm: $(npm --version)"

      - name: Verify OIDC availability
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL}" ]; then
            echo "❌ OIDC token not available — cannot publish with provenance"
            exit 1
          fi
          echo "✅ OIDC endpoint available"

      - name: Resolve inputs
        id: inputs
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "run_id=${{ github.event.client_payload.run_id }}" >> "$GITHUB_OUTPUT"
            echo "version=${{ github.event.client_payload.version }}" >> "$GITHUB_OUTPUT"
            echo "checksums=${{ github.event.client_payload.checksums }}" >> "$GITHUB_OUTPUT"
          else
            echo "run_id=${{ github.event.inputs.run_id }}" >> "$GITHUB_OUTPUT"
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "checksums=${{ github.event.inputs.checksums }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download tarballs from private repo
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dino-tarballs
          path: /tmp/tarballs
          github-token: ${{ secrets.PROJECT_DINO_ACTIONS_TOKEN }}
          repository: Dino-HQ/project-dino
          run-id: ${{ steps.inputs.outputs.run_id }}

      - name: Verify checksums
        run: |
          cd /tmp/tarballs
          echo "${{ steps.inputs.outputs.checksums }}" | base64 -d > expected.sha256
          echo "Expected checksums:"
          cat expected.sha256

          sha256sum --check expected.sha256
          echo "✅ All checksums verified"

      - name: Publish with provenance
        run: |
          cd /tmp/tarballs
          shopt -s nullglob
          for tgz in ./*.tgz; do
            [ -f "$tgz" ] || continue
            PKG_NAME=$(tar -xOzf "$tgz" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).name")
            echo "Publishing ${PKG_NAME} from ${tgz}..."

            npm publish "$tgz" --provenance --access public
            echo "✅ Published ${PKG_NAME} with provenance"
          done

      # --- Signed GitHub Release (Scorecard Signed-Releases check) -------------
      # npm provenance already attests the package; this also produces a Sigstore
      # build-provenance bundle and attaches it to a GitHub Release so the release
      # artifacts are independently verifiable. Both steps are non-fatal: the npm
      # publish above has already succeeded, so a release hiccup never blocks it.
      - name: Attest build provenance for tarballs
        id: attest
        continue-on-error: true
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: "/tmp/tarballs/*.tgz"

      - name: Create signed GitHub Release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.inputs.outputs.version }}
        run: |
          cd /tmp/tarballs
          # Attach the Sigstore attestation bundle as a verifiable release asset.
          if [ -n "${{ steps.attest.outputs.bundle-path }}" ] && [ -f "${{ steps.attest.outputs.bundle-path }}" ]; then
            cp "${{ steps.attest.outputs.bundle-path }}" "dino-${VERSION}.sigstore.json"
          fi
          gh release create "v${VERSION}" ./*.tgz ./*.sigstore.json \
            --repo "${{ github.repository }}" \
            --title "v${VERSION}" \
            --generate-notes \
          || gh release upload "v${VERSION}" ./*.tgz ./*.sigstore.json --clobber --repo "${{ github.repository }}"
