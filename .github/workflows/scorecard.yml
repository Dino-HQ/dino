# OpenSSF Scorecard — automated supply-chain security scoring.
# Publishes a public score + badge (scorecard.dev) for this repo, so the
# security posture is third-party-verifiable. Runs weekly, on pushes to the
# default branch, and when branch-protection rules change.
# Docs: https://github.com/ossf/scorecard-action
name: Scorecard supply-chain security

on:
  schedule:
    - cron: "24 6 * * 1" # weekly, keeps the score fresh without pushes
  push:
    branches: ["main"]
  branch_protection_rule: # re-score when protection rules change (a Scorecard input)

# Least privilege at the top; the job grants exactly what it needs.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload results to the code-scanning dashboard
      id-token: write # OIDC, required to publish the public score/badge
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true # → public score + README/website badge

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: results.sarif
